<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const muteBtn = document.getElementById('mute');
const lbEl = document.getElementById('lb');
const lbList = lbEl.querySelector('ol');
const lbEmpty = lbEl.querySelector('.empty');
const visitorsEl = document.querySelector('#visitors b');
const playerChip = document.getElementById('playerChip');
const modal = document.getElementById('modal');
const form = modal.querySelector('form');
const fName = document.getElementById('fName');
const fEmail = document.getElementById('fEmail');
const fErr = modal.querySelector('.err');

// ---------- layout: virtual 600-unit-tall world ----------
const H = 600, MID = 300, HALF = 110, TOP = MID - HALF, BOT = MID + HALF;
const CAT_H = 13; // half body height: center sits this far from the rail
let W = 1000, VH = 600, OFFY = 0, S = 1, dpr = 1, CX = 220, PORTRAIT = false, SAFE = { t: 0, r: 0, b: 0, l: 0 };
const TOUCH = matchMedia('(pointer: coarse)').matches;
const safeEl = document.getElementById('safe');

function resize() {
  // cap the backing store (~2.6 MP): huge retina canvases make every glow and fill crawl
  // (phones get a smaller budget: their GPUs are weaker and the screen is small anyway)
  dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt((TOUCH ? 1.6e6 : 2.6e6) / (innerWidth * innerHeight)));
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  PORTRAIT = innerHeight > innerWidth * 1.1;
  // portrait zooms in (narrower world) so the track isn't a thin strip
  S = Math.min(cv.height / H, cv.width / (PORTRAIT ? 430 : 560));
  W = cv.width / S;
  VH = cv.height / S;
  OFFY = (VH - H) / 2;
  CX = Math.max(PORTRAIT ? 78 : 110, Math.min(W * 0.26, 260));
  const sf = getComputedStyle(safeEl), u = dpr / S;
  SAFE = { t: parseFloat(sf.paddingTop) * u || 0, r: parseFloat(sf.paddingRight) * u || 0,
    b: parseFloat(sf.paddingBottom) * u || 0, l: parseFloat(sf.paddingLeft) * u || 0 };
  buildOverlay();
}

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k, d) {
    try {
      let v = localStorage.getItem(k);
      for (const old of ['vroomflip.', 'cataline.']) { // pre-rename keys
        if (v === null) v = localStorage.getItem(k.replace(/^thrusters\./, old));
      }
      return v === null ? d : v;
    } catch { return d; }
  },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const SPARKS = ['#ffffff', '#e4e9f2', '#00e5ff', '#ff2b4a', '#ff8a00', '#ffe600'];

// ---------- pre-rendered layers ----------
const sunCv = document.createElement('canvas');
const SUN_R = 150, SUN_PAD = 60; // glow is baked in once instead of blurred every frame
(function buildSun() {
  const R = SUN_R, P = SUN_PAD, s = 1.5;
  sunCv.width = sunCv.height = (R + P) * 2 * s;
  const c = sunCv.getContext('2d');
  c.scale(s, s);
  const g = c.createLinearGradient(0, P, 0, P + R * 2);
  g.addColorStop(0, '#fff36b'); g.addColorStop(0.45, '#ff9a3c'); g.addColorStop(0.8, '#ff2b9a');
  c.fillStyle = g;
  c.shadowColor = '#ff2b9a'; c.shadowBlur = 60 * s;
  c.beginPath(); c.arc(P + R, P + R, R, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;
  c.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) {
    const y = P + R * 0.95 + i * i * 2.2 + i * 8;
    c.fillRect(P, y, R * 2, 2 + i * 1.1);
  }
})();

const mountains = [0, 1].map(layer => {
  const n = 64, a = [];
  let h = 30;
  for (let i = 0; i < n; i++) { h = clamp(h + rand(-26, 26), 8, layer ? 70 : 110); a.push(h); }
  a[n - 1] = a[0];
  return a;
});

const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), s: rand(0.5, 2), t: rand(0, 6) }));

const overlayCv = document.createElement('canvas');
function buildOverlay() {
  overlayCv.width = cv.width; overlayCv.height = cv.height;
  const c = overlayCv.getContext('2d');
  const line = document.createElement('canvas');
  line.width = 4; line.height = 4;
  const lc = line.getContext('2d');
  lc.fillStyle = 'rgba(0,0,0,0.18)'; lc.fillRect(0, 0, 4, 1);
  c.fillStyle = c.createPattern(line, 'repeat');
  c.fillRect(0, 0, cv.width, cv.height);
  const vg = c.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * 0.35, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  c.fillStyle = vg; c.fillRect(0, 0, cv.width, cv.height);
}

// ---------- audio (procedural synthwave) ----------
let AC = null, master = null, musicGain = null, noiseBuf = null;
let muted = store.get('thrusters.muted', '0') === '1';
const music = { step: 0, next: 0, timer: null };

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.55;
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  music.next = AC.currentTime + 0.05;
  music.timer = setInterval(scheduleMusic, 25);
}

function tone(freq, dur, type = 'sine', vol = 0.1, dest = master, when = 0, slideTo = 0) {
  if (!AC) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
}

function noise(dur, vol, when = 0, dest = master, type = 'highpass', freq = 6000) {
  if (!AC) return;
  const t = when || AC.currentTime;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur + 0.02);
}

const CHORDS = [
  { bass: 110.0, notes: [440.0, 523.25, 659.25] },  // Am
  { bass: 87.31, notes: [349.23, 440.0, 523.25] },  // F
  { bass: 130.81, notes: [392.0, 523.25, 659.25] }, // C
  { bass: 98.0, notes: [392.0, 493.88, 587.33] },   // G
];
const ARP = [0, 1, 2, 1, 0, 2, 1, 2];

function scheduleMusic() {
  if (!AC || document.hidden) return;
  const bpm = state === 'play' ? 116 + Math.min(24, level * 4) : 100;
  const stepDur = 60 / bpm / 4;
  while (music.next < AC.currentTime + 0.12) {
    const s = music.step % 16, bar = Math.floor(music.step / 16) % 4, ch = CHORDS[bar], t = music.next;
    const intense = state === 'play';
    if (s % 2 === 0) tone(s % 4 === 0 ? ch.bass : ch.bass * 2, stepDur * 1.8, 'sawtooth', 0.09, musicGain, t);
    if (intense) {
      if (s % 4 === 0) tone(150, 0.18, 'sine', 0.5, musicGain, t, 40);
      if (s === 4 || s === 12) noise(0.12, 0.18, t, musicGain, 'bandpass', 1800);
      if (s % 2 === 1) noise(0.04, 0.07, t, musicGain);
      tone(ch.notes[ARP[s % 8]] * (level >= 2 && s >= 8 ? 2 : 1), stepDur * 0.9, 'square', 0.035, musicGain, t);
    } else if (s % 4 === 0) {
      tone(ch.notes[ARP[(s / 4) % 8]], stepDur * 3.5, 'triangle', 0.05, musicGain, t);
    }
    music.next += stepDur;
    music.step++;
  }
}

const sfx = {
  flip(dir) { tone(dir > 0 ? 700 : 420, 0.09, 'square', 0.06, master, 0, dir > 0 ? 380 : 820); },
  land() { tone(140, 0.08, 'sine', 0.18, master, 0, 60); },
  cell(c) { const f = 660 * Math.pow(2, Math.min(c, 12) / 12); tone(f, 0.12, 'triangle', 0.13); tone(f * 1.5, 0.14, 'triangle', 0.09, master, AC ? AC.currentTime + 0.05 : 0); },
  rocket() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, 'square', 0.06, master, AC ? AC.currentTime + i * 0.06 : 0)); },
  shieldBreak() { noise(0.35, 0.3, 0, master, 'bandpass', 2500); tone(900, 0.3, 'sawtooth', 0.08, master, 0, 200); },
  die() { noise(0.6, 0.45, 0, master, 'lowpass', 1200); tone(420, 0.7, 'sawtooth', 0.14, master, 0, 35); },
  nitro() { tone(180, 0.5, 'sawtooth', 0.12, master, 0, 1400); noise(0.5, 0.2, 0, master, 'bandpass', 1200); },
  titan() { [110, 165, 220].forEach(f => tone(f, 0.5, 'sawtooth', 0.08)); tone(70, 0.6, 'sine', 0.4, master, 0, 40); },
  smash() { noise(0.25, 0.35, 0, master, 'lowpass', 900); tone(95, 0.2, 'square', 0.15, master, 0, 40); },
  level() { [784, 988, 1175].forEach((f, i) => tone(f, 0.12, 'triangle', 0.08, master, AC ? AC.currentTime + i * 0.07 : 0)); },
};

        'before-interactive-callback': () => humanEl.classList.add('show'),

function onSim(ev, d) {

  } else if (ev === 'buffEnd') {

  } else if (ev === 'smash') {
    shake = Math.max(shake, 9);
    burst(CX + d.dx, d.y, 30, ['#ff4b3b', '#ff2bd6', '#ffffff', '#ffe600'], 440, 0.8, 4.5, 500);
    pop(CX + d.dx, d.y - 30, 'SMASH +50', '#ff2bd6', 18);

    shake = 10; flash = 0.4; flashColor = '#00e5ff';

    cheerKind = d.kind; cheerT = 0;
    cheerMsg = CHEERS[d.kind][(Math.random() * CHEERS[d.kind].length) | 0];
    burst(x, d.y, 36, [b.color, '#ffffff', '#ffe600'], 340, 0.8, 4, 0);
    pop(x, d.y - 34, b.label + '!', b.color, 24);
    flash = 0.35; flashColor = b.color; shake = Math.max(shake, 6);
    sfx[d.kind]();
  } else if (ev === 'cell') {
    const x = sx(d.o);
    burst(x, d.o.y, 14, ['#ffe600', '#ff8a00', '#ffffff'], 220, 0.5, 3, 0);
    pop(x, d.o.y - 24, '+' + d.pts, G.combo >= 5 ? '#2bff88' : '#ffe600', 16 + Math.min(G.combo, 10));
    sfx.cell(G.combo);
  } else if (ev === 'rocket') {
    const x = sx(d);
    burst(x, d.y, 30, ['#ffd23f', '#ffffff', '#00e5ff'], 300, 0.7, 3.5, 0);
    pop(x, d.y - 30, 'THRUSTER SHIELD!', '#ffd23f', 22);
    flash = 0.3; flashColor = '#ffd23f';
    sfx.rocket();
  } else if (ev === 'die') die();
}

// ---------- particles ----------
function burst(x, y, n, colors, spd = 260, life = 0.7, size = 3, g = 400) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * 0.5, life), max: life,
      c: colors[(Math.random() * colors.length) | 0], s: rand(size * 0.5, size), g });
  }
}
function pop(x, y, text, c = '#ffe600', size = 20) { pops.push({ x, y, text, c, life: 0.9, size }); }

// ---------- rocket-landing smoke ----------
const SMOKE_TINTS = ['#ffffff', '#e2d6ff', '#cfefff', '#ffd9ef'];
const smokeSprites = SMOKE_TINTS.map(c => {
  const sp = document.createElement('canvas');
  sp.width = sp.height = 64;
  const g = sp.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, c); g.addColorStop(0.45, c + 'aa'); g.addColorStop(1, c + '00');
  const sc = sp.getContext('2d');
  sc.fillStyle = g; sc.fillRect(0, 0, 64, 64);
  return sp;
});

function puff(x, y, vx, vy, r, grow, life, a = 0.55) {
  if (smoke.length > 110) smoke.shift();
  smoke.push({ x, y, vx, vy, r, grow, life, max: life, a, spr: (Math.random() * smokeSprites.length) | 0 });
}

// cloud that hugs the rail and rolls outward both ways, rising into the corridor (away = -1 up, +1 down)
function smokeCloud(x, railY, away, n, power) {
  for (let i = 0; i < n; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    puff(x + rand(-14, 14), railY + away * rand(2, 8),
      side * rand(40, 340) * power, away * rand(10, 90) * power,
      rand(7, 13), rand(22, 40) * power, rand(0.9, 1.6), rand(0.32, 0.52));
  }
  for (let i = 0; i < n / 5; i++) // central column pushed into the corridor
    puff(x + rand(-8, 8), railY + away * 6, rand(-30, 30), away * rand(80, 200) * power, rand(8, 12), rand(20, 40), rand(0.6, 1.1), 0.4);
}

function liftoffSmoke(oldDir) {
  smokeCloud(CX, oldDir > 0 ? BOT : TOP, -oldDir, 12, 0.85);
  if (AC) noise(0.45, 0.16, 0, master, 'lowpass', 500);
}

// ---------- input ----------
function action() {
  if (modalOpen || playersOpen) return;
  initAudio();
  if (!profile && state !== 'play') return openModal(true);
  if (state === 'menu') start();
  else if (state === 'play') { inputs.push(G.steps); holds.push(-1); G.press(); return true; } // recorded for the server's replay
  else if (state === 'dead' && deadT > 0.7) start();
}

// how long each in-game press is held (ms): automation presses keys in ~0 ms, people don't
let holds = [];
const downAt = new Map(); // key code / pointer id -> [press index, timeStamp]
function pressStart(id, e) { if (action()) downAt.set(id, [holds.length - 1, e.timeStamp, holds]); }
function pressEnd(id, e) {
  const d = downAt.get(id);
  if (!d) return;
  downAt.delete(id);
  if (d[2] === holds) holds[d[0]] = Math.min(10000, Math.round(e.timeStamp - d[1]));
}

// synthetic events (scripts calling dispatchEvent) don't play the game
addEventListener('keydown', e => {
  if (!e.isTrusted || e.repeat || modalOpen || playersOpen || e.target.closest?.('button, input')) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', 'Enter'].includes(e.code)) { e.preventDefault(); pressStart(e.code, e); }
  else if (e.code === 'KeyM') { initAudio(); setMuted(!muted); }
});
addEventListener('keyup', e => pressEnd(e.code, e));
// mouse clicks aren't timed: trackpad tap-to-click really does release in ~0 ms
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!e.isTrusted) return;
  if (e.pointerType === 'mouse') action(); else pressStart('p' + e.pointerId, e);
});
addEventListener('pointerup', e => pressEnd('p' + e.pointerId, e));
addEventListener('pointercancel', e => pressEnd('p' + e.pointerId, e));
muteBtn.addEventListener('click', e => { e.stopPropagation(); initAudio(); setMuted(!muted); });
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else { AC.resume(); music.next = AC.currentTime + 0.05; }
});

// ---------- update ----------
function die() {
  state = 'dead'; deadT = 0; timeScale = 0.25;
  sync();
  document.body.classList.remove('playing');
  shake = 22; flash = 0.9; flashColor = '#ff2b6a';
  deathMsg = DEATH_MSGS[(Math.random() * DEATH_MSGS.length) | 0];
  burst(CX, P.y, 70, SPARKS, 520, 1.4, 4.5, 300);
  burst(CX, P.y, 20, ['#ffffff'], 700, 0.5, 2, 0);
  if (score > best) { best = score; newBest = true; store.set('thrusters.best', String(best)); }
  submitScore();
  if (musicGain) musicGain.gain.setTargetAtTime(0.08, AC.currentTime, 0.2);
  sfx.die();
}

function update(dt) {
  tAll += dt;
  const sdt = dt * timeScale;
  if (state === 'dead') { deadT += dt; timeScale = lerp(timeScale, 1, dt * 1.5); }
  if (state === 'play') cheerT += dt;

  if (state !== 'dead') {
    // fixed-step simulation (the server replays exactly these steps)
    acc += dt;
    while (acc >= Sim.STEP && state !== 'dead') { G.step(); acc -= Sim.STEP; }
    // menu demo: auto flip
    if (state === 'menu') {
      menuFlipT -= dt;
      if (menuFlipT <= 0 && G.P.grounded) { G.press(); menuFlipT = rand(0.8, 1.8); }
    }
  }

  if (state !== 'dead') {
    sync();
    // draw the leftover fraction of a step ahead, so motion stays smooth on any refresh rate
    dist += speed * acc;
    if (!P.grounded) P.y = clamp(P.y + P.vy * acc, TOP + CAT_H, BOT - CAT_H);

    P.run += sdt * speed * 0.05;
    if (!P.grounded) {
      if (Math.random() < 0.85) parts.push({ x: CX - 30, y: P.y + rand(-2, 2), vx: rand(-280, -140), vy: rand(-30, 30),
        life: 0.35, max: 0.35, c: Math.random() < 0.5 ? '#00e5ff' : '#ffffff', s: rand(1.5, 3), g: 0 });
      const target = P.dir > 0 ? BOT - CAT_H : TOP + CAT_H;
      const rail = target + P.dir * CAT_H, gapToRail = Math.abs(rail - P.y);
      // retro-thrust: as the car nears the rail, its underbody jets blast smoke off the surface
      if (gapToRail < 80 && Math.random() < 0.6 - gapToRail / 160) {
        const k = 1 - gapToRail / 80;
        for (const jx of [-22, 22]) puff(CX + jx + rand(-4, 4), rail - P.dir * 4,
          (jx < 0 ? -1 : 1) * rand(60, 220) * k + rand(-30, 30), -P.dir * rand(10, 60), rand(4, 8), rand(25, 45), rand(0.5, 1.0), 0.45 * k + 0.1);
      }
    }
    P.vis = lerp(P.vis, P.dir, Math.min(1, sdt * 16));
    P.squash = Math.max(0, P.squash - sdt * 5);

    trail.push({ x: dist, y: P.y, v: P.vis });
    while (trail.length && dist - trail[0].x > CX + 40) trail.shift();
  }

  for (const p of parts) { p.vy += p.g * sdt; p.x += p.vx * sdt; p.y += p.vy * sdt; p.life -= sdt; if (state !== 'dead') p.x -= speed * sdt * 0.4; }
  parts = parts.filter(p => p.life > 0);
  const drag = Math.exp(-sdt * 2.6), scroll = state === 'dead' ? 0 : speed * sdt;
  for (const m of smoke) {
    m.vx *= drag; m.vy *= drag;
    m.x += m.vx * sdt - scroll; m.y += m.vy * sdt;
    m.r += m.grow * sdt; m.life -= sdt;
  }
  smoke = smoke.filter(m => m.life > 0 && m.x + m.r > -40);
  for (const p of pops) { p.y -= 50 * dt; p.life -= dt; }
  cheerK = lerp(cheerK, state === 'play' && (buffs.nitro > 0 || buffs.titan > 0) ? 1 : 0, Math.min(1, dt * 7));
  pops = pops.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 1.8);
}

function railColor() { return `hsl(${(190 + G.level * 47) % 360} 100% 60%)`; }

// ---------- drawing ----------
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function noGlow() { ctx.shadowBlur = 0; }

function drawBackground() {
  const top = -OFFY, bottom = VH - OFFY;
  const g = ctx.createLinearGradient(0, top, 0, MID);
  g.addColorStop(0, '#07001a'); g.addColorStop(0.55, '#2a0050'); g.addColorStop(1, '#7a0a6e');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, MID - top);
  const g2 = ctx.createLinearGradient(0, MID, 0, bottom);
  g2.addColorStop(0, '#1d0038'); g2.addColorStop(1, '#05000f');
  ctx.fillStyle = g2; ctx.fillRect(0, MID, W, bottom - MID);

  // stars
  for (const s of stars) {
    const x = ((s.x * W - dist * 0.02 * s.s) % W + W) % W;
    const y = top + s.y * (MID - top - 40);
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(tAll * 1.5 + s.t));
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // sun
  const sr = SUN_R, sp = SUN_PAD, sx = W * 0.7;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, W, MID - top); ctx.clip();
  ctx.drawImage(sunCv, sx - sr - sp, MID - sr * 1.25 - sp, (sr + sp) * 2, (sr + sp) * 2);
  ctx.restore();

  // mountains
  const layerCols = ['#3a0a5c', '#170028'], par = [0.04, 0.1];
  mountains.forEach((m, li) => {
    const scroll = dist * par[li], step = 46, n = m.length;
    ctx.fillStyle = layerCols[li];
    ctx.beginPath(); ctx.moveTo(-step, MID);
    const i0 = Math.floor(scroll / step);
    for (let i = i0 - 1; i <= i0 + Math.ceil(W / step) + 1; i++) {
      const h = m[((i % n) + n) % n] * (li ? 0.8 : 1);
      ctx.lineTo(i * step - scroll, MID - h);
    }
    ctx.lineTo(W + step, MID); ctx.closePath(); ctx.fill();
    if (li === 0) { ctx.strokeStyle = 'rgba(255,79,216,0.35)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  });

  // perspective grid floor
  ctx.save();
  ctx.beginPath(); ctx.rect(0, MID, W, bottom - MID); ctx.clip();
  const gc = railColor();
  ctx.strokeStyle = gc; ctx.lineWidth = 1.2;
  const phase = (dist * 0.004) % 1;
  for (let k = 0; k < 30; k++) {
    const z = (k + 1 - phase) * 0.35;
    if (z < 0.12) continue;
    const y = MID + 90 / z;
    if (y > bottom) continue;
    ctx.globalAlpha = clamp(1.2 - z * 0.12, 0.05, 0.6);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.globalAlpha = 0.45;
  const vx = W / 2, o = (dist * 0.6) % 70;
  ctx.beginPath();
  for (let j = -40; j <= 40; j++) {
    const b = j * 70 - o;
    ctx.moveTo(vx + b * 0.04, MID); ctx.lineTo(vx + b * 3, bottom + 200);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // horizon glow
  const hg = ctx.createLinearGradient(0, MID - 30, 0, MID + 30);
  hg.addColorStop(0, 'rgba(255,43,154,0)'); hg.addColorStop(0.5, 'rgba(255,43,154,0.45)'); hg.addColorStop(1, 'rgba(255,43,154,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, MID - 30, W, 60);
}

function drawRails() {
  ctx.fillStyle = 'rgba(8,0,24,0.42)';
  ctx.fillRect(0, TOP, W, BOT - TOP);
  const c = railColor();
  for (const y of [TOP, BOT]) {
    ctx.strokeStyle = c;
    for (const [lw, a] of [[16, 0.12], [9, 0.25], [4, 1]]) {
      ctx.globalAlpha = a; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2;
    ctx.setLineDash([26, 34]); ctx.lineDashOffset = dist % 60;
    const off = y === TOP ? -7 : 7;
    ctx.beginPath(); ctx.moveTo(0, y + off); ctx.lineTo(W, y + off); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // light streaks: full-width rear light bar (red), underbody fan glow (cyan), roof highlight (white)
  const streaks = [[-1, '255,43,74', 3.2], [8, '0,229,255', 2.2], [-9, '255,255,255', 1]];
  const head = CX - 28, tail = head - (CX + 40);
  for (const [off, rgb, w] of streaks) {
    const g = ctx.createLinearGradient(tail, 0, head, 0);
    g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(0.6, `rgba(${rgb},0.85)`); g.addColorStop(1, `rgba(${rgb},0.05)`);
    ctx.strokeStyle = g;
    for (const [lw, a] of [[w * 3.5, 0.25], [w, 1]]) { // soft halo + core instead of shadowBlur
      ctx.lineWidth = lw; ctx.globalAlpha = a;
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const p = trail[i], x = p.x - dist + CX - 28, y = p.y + off * p.v;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// thruster plume from (x,y) along unit dir (dx,dy): wide soft halo, cyan body, white-hot core.
// each layer starts narrow at the nozzle and swells mid-plume, so there's no hard edge at the car
const FLAME_PALS = { // [halo tip, halo base, body, fade-out]
  cyan: ['rgba(138,91,255,0.3)', 'rgba(0,229,255,0.3)', 'rgba(0,229,255,0.95)', 'rgba(0,229,255,0)'],
  nitro: ['rgba(255,60,0,0.38)', 'rgba(255,138,0,0.38)', 'rgba(255,170,0,0.95)', 'rgba(255,90,0,0)'],
  titan: ['rgba(255,43,214,0.38)', 'rgba(255,43,214,0.38)', 'rgba(255,79,216,0.95)', 'rgba(255,43,214,0)'],
};
let flamePal = FLAME_PALS.cyan;
function flame(x, y, dx, dy, len, w) {
  const px = -dy, py = dx; // perpendicular
  const layers = [[len * 1.15, w * 0.7, w * 2.4, flamePal[0], flamePal[1]],
                  [len, w * 0.6, w * 1.2, flamePal[2], 'rgba(255,255,255,0.95)'],
                  [len * 0.45, w * 0.3, w * 0.5, 'rgba(255,255,255,0.2)', 'rgba(255,255,255,1)']];
  for (const [l, bw, mw, tip, base] of layers) {
    const g = ctx.createLinearGradient(x, y, x + dx * l, y + dy * l);
    g.addColorStop(0, base); g.addColorStop(0.35, tip); g.addColorStop(1, flamePal[3]);
    ctx.fillStyle = g;
    const mx = x + dx * l * 0.3, my = y + dy * l * 0.3;
    ctx.beginPath();
    ctx.moveTo(x + px * bw, y + py * bw);
    ctx.quadraticCurveTo(mx + px * mw, my + py * mw, x + dx * l, y + dy * l);
    ctx.quadraticCurveTo(mx - px * mw, my - py * mw, x - px * bw, y - py * bw);
    ctx.closePath(); ctx.fill();
  }
}

// Tesla Roadster (2025 reveal): low white wedge, hidden headlights, full-width rear
// light bar, thin-spoke wheels, auto-adjusting rear wing, underbody fans + thrusters
function drawCar(x, y, vis, run, sc = 1) {
  ctx.save();
  ctx.translate(x, y);
  const sq = 1 + P.squash * 0.2;
  ctx.scale(sc * sq, sc * vis / sq);
  if (invuln > 0 && Math.floor(tAll * 20) % 2) ctx.globalAlpha = 0.35;
  else if (buffs.nitro > 0) ctx.globalAlpha = 0.72 + Math.sin(tAll * 30) * 0.15; // phasing shimmer
  const air = !P.grounded;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // thruster flames: rear boost always, underbody fans fire hard while flying
  ctx.globalCompositeOperation = 'lighter';
  const flick = 0.85 + Math.sin(tAll * 47) * 0.08 + Math.random() * 0.12;
  // rear boost: long plume, longer while flying and at speed
  flamePal = FLAME_PALS[buffs.nitro > 0 ? 'nitro' : buffs.titan > 0 ? 'titan' : 'cyan'];
  const fl = ((air ? 92 : 50) + clamp((speed - 380) / 10, 0, 30)) * flick * (1 + 0.5 * nitroK);
  flame(-28, 0, -1, 0, fl, 8);
  if (air) for (const fx of [-22, 22]) flame(fx, 5, 0, 1, (48 + Math.random() * 14) * flick, 6); // underbody jets
  ctx.globalCompositeOperation = 'source-over';

  // underglow
  glow('#00e5ff', 16);
  ctx.strokeStyle = 'rgba(0,229,255,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-9, 5.5); ctx.lineTo(9, 5.5); ctx.stroke();
  noGlow();

  // wheels with thin spokes
  for (const wx of [-17, 17]) {
    ctx.save(); ctx.translate(wx, 7.5); ctx.rotate(run * 0.9);
    ctx.fillStyle = '#0c0c14'; ctx.beginPath(); ctx.arc(0, 0, 5.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#cfd8e6'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 4, Math.sin(a) * 4); }
    ctx.stroke();
    ctx.fillStyle = '#ff2b4a'; ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // rear wing: rises when flying / at speed
  const lift = air ? 5 : clamp((speed - 380) / 120, 0, 3);
  ctx.strokeStyle = '#9aa6b8'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-23, -5); ctx.lineTo(-24, -6 - lift); ctx.stroke();
  ctx.fillStyle = '#eef2f8';
  ctx.beginPath(); ctx.moveTo(-30, -6.5 - lift); ctx.lineTo(-19, -7.5 - lift); ctx.lineTo(-19, -6 - lift); ctx.lineTo(-30, -5 - lift); ctx.closePath(); ctx.fill();

  // body
  let g = ctx.createLinearGradient(0, -12, 0, 6);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#e4e9f2'); g.addColorStop(1, '#a9b3c4');
  ctx.fillStyle = g;
  glow('rgba(200,240,255,0.9)', 12);
  ctx.beginPath();
  ctx.moveTo(-28, 5);
  ctx.lineTo(-29.5, -1.5);
  ctx.quadraticCurveTo(-29, -5, -25, -5.5);
  ctx.lineTo(-13, -6.5);
  ctx.quadraticCurveTo(-6, -12.5, 2, -11);
  ctx.quadraticCurveTo(7, -9.5, 10, -7);
  ctx.quadraticCurveTo(22, -5, 28.5, -1.5);
  ctx.quadraticCurveTo(30, 1.5, 28, 5);
  ctx.lineTo(23.5, 5);
  ctx.arc(17, 7.5, 7, -0.37, Math.PI + 0.37, true);
  ctx.lineTo(-10.5, 5);
  ctx.arc(-17, 7.5, 7, -0.37, Math.PI + 0.37, true);
  ctx.closePath();
  ctx.fill();
  noGlow();

  // canopy
  g = ctx.createLinearGradient(-10, -11, 8, -7);
  g.addColorStop(0, '#0a1020'); g.addColorStop(0.55, '#1d2b4a'); g.addColorStop(1, '#0a1020');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-11, -6.8); ctx.quadraticCurveTo(-5, -11.4, 2, -10.2); ctx.quadraticCurveTo(6, -9, 8.5, -7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,229,255,0.55)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-6, -8.6); ctx.quadraticCurveTo(-1, -10.4, 3, -9.6); ctx.stroke();

  // flat side surface crease + door line
  ctx.strokeStyle = 'rgba(120,135,160,0.7)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-24, -1); ctx.quadraticCurveTo(0, -2.5, 25, -0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, -6.5); ctx.lineTo(-7, 4); ctx.stroke();

  // hidden headlight slit
  glow('#bff6ff', 12);
  ctx.strokeStyle = '#e8fdff'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(22, -3.3); ctx.lineTo(28.4, -1.3); ctx.stroke();
  // full-width rear light bar
  glow('#ff2b4a', 14);
  ctx.fillStyle = '#ff2b4a';
  ctx.fillRect(-30, -3.4, 2.4, 3.6);
  noGlow();
  ctx.restore();

  if (buffs.titan > 0 && (buffs.titan > 1.5 || Math.floor(tAll * 10) % 2)) {
    const r = 1 + Math.sin(tAll * 14) * 0.06;
    glow('#ff2bd6', 22);
    ctx.strokeStyle = 'rgba(255,43,214,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x + 2, y, 36 * r, 19 * r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; // battering ram glint on the nose
    ctx.beginPath(); ctx.moveTo(x + 31, y - 6 * vis); ctx.lineTo(x + 36, y); ctx.lineTo(x + 31, y + 6 * vis); ctx.stroke();
    noGlow();
  }

  if (P.shield) {
    const r = 1 + Math.sin(tAll * 6) * 0.05;
    glow('#ffd23f', 18);
    ctx.strokeStyle = 'rgba(255,210,63,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y, 40 * r, 24 * r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.12; ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.globalAlpha = 1;
    noGlow();
  }
}

function drawObjects() {
  for (const o of objs) {
    const sx = o.x - dist + CX;
    if (o.broken || sx > W + 60 || sx + (o.w || 40) < -60) continue;
    if (o.t === 'spike') {
      const n = Math.max(1, Math.round(o.w / 20)), tw = o.w / n, base = o.side > 0 ? BOT : TOP, h = o.side > 0 ? -20 : 20;
      glow('#ff3b3b', 16);
      ctx.fillStyle = '#3d0010'; ctx.strokeStyle = '#ff4b3b'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        ctx.moveTo(sx + i * tw, base); ctx.lineTo(sx + i * tw + tw / 2, base + h); ctx.lineTo(sx + (i + 1) * tw, base);
      }
      ctx.fill(); ctx.stroke();
      noGlow();
    } else if (o.t === 'saw') {
      const oy = o.y + Sim.sin(G.t * o.f + o.ph) * o.amp;
      ctx.save(); ctx.translate(sx, oy); ctx.rotate(o.rot || tAll * 9);
      glow('#ff2bd6', 18);
      ctx.fillStyle = '#2a0024'; ctx.strokeStyle = '#ff2bd6'; ctx.lineWidth = 2.2;
      ctx.beginPath();
      const teeth = 10;
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i / (teeth * 2)) * Math.PI * 2, r = i % 2 ? o.r * 0.7 : o.r;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff2bd6'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      noGlow(); ctx.restore();
    } else if (o.t === 'cell' && !o.got) {
      // energy cell: glowing ring with a lightning bolt
      const y = o.y + Math.sin(tAll * 4 + o.ph) * 3;
      ctx.save(); ctx.translate(sx, y); ctx.scale(Math.cos(tAll * 3 + o.ph) * 0.35 + 0.85, 1);
      glow('#ffe600', 14);
      ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(40,30,0,0.75)';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff36b';
      ctx.beginPath(); ctx.moveTo(1.5, -7); ctx.lineTo(-4.5, 1); ctx.lineTo(-0.5, 1); ctx.lineTo(-1.5, 7); ctx.lineTo(4.5, -1); ctx.lineTo(0.5, -1); ctx.closePath(); ctx.fill();
      noGlow();
      ctx.restore();
    } else if (o.t === 'buff' && !o.got) {
      const b = BUFFS[o.kind], y = o.y + Sim.sin(G.t * 3 + o.ph) * 8;
      ctx.save(); ctx.translate(sx, y);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(tAll * 6);
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(tAll * 6) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.rotate(tAll * 1.5);
      glow(b.color, 18);
      ctx.fillStyle = '#1a0533'; ctx.strokeStyle = b.color; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) ctx.lineTo(Math.cos(i * Math.PI / 3) * 16, Math.sin(i * Math.PI / 3) * 16);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      noGlow();
      ctx.rotate(-tAll * 1.5);
      ctx.fillStyle = ctx.strokeStyle = '#ffffff';
      if (o.kind === 'nitro') { // double chevron
        ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const off of [-4, 4]) { ctx.beginPath(); ctx.moveTo(off - 3.5, -6.5); ctx.lineTo(off + 3, 0); ctx.lineTo(off - 3.5, 6.5); ctx.stroke(); }
      } else { // dumbbell
        ctx.fillRect(-7, -1.5, 14, 3); ctx.fillRect(-10, -6, 3, 12); ctx.fillRect(7, -6, 3, 12);
        ctx.fillRect(-12.5, -4, 2.5, 8); ctx.fillRect(10, -4, 2.5, 8);
      }
      ctx.restore();
      text(b.name, sx, y + 31, 10, b.color, 'center', 900);
    } else if (o.t === 'rocket' && !o.got) {
      // thruster pack pickup: small white rocket with flame
      const y = o.y + Sim.sin(G.t * 3) * 10;
      ctx.save(); ctx.translate(sx, y); ctx.rotate(-0.5 + Math.sin(tAll * 5) * 0.12);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(0,229,255,0.8)';
      ctx.beginPath(); ctx.moveTo(-4, 13); ctx.lineTo(0, 20 + Math.random() * 8); ctx.lineTo(4, 13); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      glow('#ffd23f', 22);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(6, -8, 5, 12); ctx.lineTo(-5, 12); ctx.quadraticCurveTo(-6, -8, 0, -16); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.moveTo(-5, 4); ctx.lineTo(-10, 14); ctx.lineTo(-5, 12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5, 4); ctx.lineTo(10, 14); ctx.lineTo(5, 12); ctx.closePath(); ctx.fill();
      noGlow();
      ctx.fillStyle = '#1d2b4a'; ctx.beginPath(); ctx.arc(0, -5, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawSmoke() {
  for (const m of smoke) {
    const t = m.life / m.max;
    ctx.globalAlpha = m.a * Math.min(1, t * 1.6) * Math.min(1, (1 - t) * 8 + 0.3);
    ctx.drawImage(smokeSprites[m.spr], m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function text(str, x, y, size, color, align = 'center', weight = 900, glowC = color) {
  ctx.font = `${weight} ${size}px Orbitron, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  glow(glowC, size * 0.5);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  noGlow();
}

function chromaTitle(str, x, y, size) {
  const j = Math.random() < 0.06 ? rand(-6, 6) : 0;
  ctx.font = `900 ${size}px Orbitron, system-ui, sans-serif`;
  const fit = (W - 32 - SAFE.l - SAFE.r) / ctx.measureText(str).width; // shrink long lines to fit narrow screens
  if (fit < 1) { size *= fit; ctx.font = `900 ${size}px Orbitron, system-ui, sans-serif`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#00e5ff'; ctx.fillText(str, x - 3 + j, y);
  ctx.fillStyle = '#ff2bd6'; ctx.fillText(str, x + 3 - j, y + 1);
  ctx.globalCompositeOperation = 'source-over';
  glow('#ff4fd8', 30);
  ctx.fillStyle = '#fff'; ctx.fillText(str, x, y);
  noGlow();
}

function drawHUD() {
  const top = -OFFY + SAFE.t + (PORTRAIT ? 34 : 40), left = 24 + SAFE.l;
  if (state === 'play' || state === 'dead') {
    text(String(score), left, top, 34, '#ffffff', 'left', 900, '#ff4fd8');
    text('BEST ' + Math.max(best, score), left + 2, top + 32, 13, '#c9a6ff', 'left', 700, '#8a5bff');
    if (combo > 1 && state === 'play') {
      const pulse = 1 + Math.max(0, comboT - 1.3) * 1.2;
      text('x' + combo + ' COMBO', left + 2, top + 58, 16 * pulse, combo >= 5 ? '#2bff88' : '#ffe600', 'left', 900);
    }
    let by = top - 11;
    for (const k in buffs) {
      if (buffs[k] <= 0 || state !== 'play') continue;
      const b = BUFFS[k], bw = Math.min(160, W * 0.3), bx = W / 2 - bw / 2, frac = buffs[k] / b.dur;
      ctx.fillStyle = 'rgba(12,0,32,0.75)'; ctx.fillRect(bx, by, bw, 22);
      glow(b.color, 12);
      ctx.fillStyle = b.color; ctx.fillRect(bx, by, bw * frac, 22);
      noGlow();
      ctx.strokeStyle = b.color; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, 22);
      text(b.label + '  ' + buffs[k].toFixed(1) + 's', W / 2, by + 11.5, 11, '#ffffff', 'center', 900, '#000000');
      by += 28;
    }
  }
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life / 0.5, 0, 1);
    text(p.text, p.x, p.y, p.size, p.c, 'center', 900);
  }
  ctx.globalAlpha = 1;
  drawCheer();
}

// cheering avatar in a neon badge while a buff runs (photo, with a drawn caricature as fallback)
function drawCheer() {
  if (cheerK < 0.01) return;
  // colour follows the latest pickup (matches the speech bubble) while it lasts
  const kind = buffs[cheerKind] > 0 ? cheerKind : buffs.nitro > 0 ? 'nitro' : buffs.titan > 0 ? 'titan' : cheerKind;
  const col = BUFFS[kind].color, R = PORTRAIT ? 40 : 46;
  const cx = 24 + SAFE.l + R - (1 - cheerK) * (R * 2 + 60);
  const cy = VH - OFFY - SAFE.b - 64 - R;
  const bob = Math.sin(tAll * 11) * 2.5, swing = Math.sin(tAll * 11) * 0.25;
  const SKIN = '#f1c7a3', SKIN_D = '#d9a67f', HAIR = '#3a2a1f';

  ctx.save();
  ctx.globalAlpha = cheerK;
  // badge background
  const bg = ctx.createRadialGradient(cx, cy - R * 0.3, 4, cx, cy, R);
  bg.addColorStop(0, col); bg.addColorStop(1, '#14002e');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  if (avatarReady) {
    // pumping fists rise from behind the badge
    for (const sd of [-1, 1]) {
      const pump = Math.max(0, Math.sin(tAll * 11 + (sd > 0 ? 0 : Math.PI)));
      const fx = cx + sd * R * 1.02, fy = cy - R * 0.62 - pump * R * 0.38 + bob, fr = R * 0.21;
      const arm = () => { ctx.beginPath(); ctx.moveTo(cx + sd * R * 0.6, cy + R * 0.6); ctx.quadraticCurveTo(cx + sd * R * 1.22, cy + R * 0.1, fx, fy + fr * 1.3); };
      ctx.lineCap = 'round';
      ctx.strokeStyle = col; ctx.lineWidth = R * 0.34; arm(); ctx.stroke();       // neon outline so the sleeve reads on dark bg
      ctx.strokeStyle = '#1b1b24'; ctx.lineWidth = R * 0.26; arm(); ctx.stroke(); // dark suit sleeve
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = R * 0.1;                      // shirt cuff
      ctx.beginPath(); ctx.moveTo(fx - fr * 0.9, fy + fr * 1.15); ctx.lineTo(fx + fr * 0.9, fy + fr * 1.15); ctx.stroke();
      ctx.fillStyle = SKIN; ctx.strokeStyle = SKIN_D; ctx.lineWidth = 1.3;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(fx - fr, fy - fr, fr * 2, fr * 2, fr * 0.6); else ctx.rect(fx - fr, fy - fr, fr * 2, fr * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); // knuckles + thumb
      for (let i = 1; i < 4; i++) { ctx.moveTo(fx - fr + i * fr / 2, fy - fr); ctx.lineTo(fx - fr + i * fr / 2, fy - fr * 0.3); }
      ctx.moveTo(fx - fr * 0.8, fy + fr * 0.25); ctx.lineTo(fx + fr * 0.5, fy + fr * 0.25);
      ctx.stroke();
    }
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R - 1.5, 0, Math.PI * 2); ctx.clip();
    ctx.translate(cx, cy + bob); ctx.rotate(Math.sin(tAll * 5.5) * 0.07); // excited head-bob
    const crop = 270; // square around the head in the 330x436 portrait
    ctx.drawImage(avatarImg, 30, 8, crop, crop, -R * 1.06, -R * 1.0, R * 2.12, R * 2.12);
    ctx.restore();
  } else {
    ctx.save();
    ctx.clip();
    ctx.translate(cx, cy + bob);
    const u = R / 46; ctx.scale(u, u);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // raised arms with fists
    for (const sd of [-1, 1]) {
      const a = swing * sd;
      const fx = sd * (34 + Math.sin(a) * 6), fy = -26 + Math.cos(tAll * 11 + sd) * 4;
      ctx.strokeStyle = '#15151c'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(sd * 20, 30); ctx.quadraticCurveTo(sd * 36, 14, fx, fy + 8); ctx.stroke();
      ctx.fillStyle = SKIN;
      ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = SKIN_D; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(fx - 4, fy - 1); ctx.lineTo(fx + 4, fy - 1); ctx.stroke();
    }
    // torso: black tee
    ctx.fillStyle = '#15151c';
    ctx.beginPath(); ctx.ellipse(0, 50, 34, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-9, 26); ctx.quadraticCurveTo(0, 32, 9, 26); ctx.stroke();
    // neck
    ctx.fillStyle = SKIN_D; ctx.fillRect(-6, 14, 12, 12);
    // ears
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.ellipse(-17, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.ellipse(17, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    // head: broad face, strong jaw
    ctx.beginPath();
    ctx.moveTo(-16, -8);
    ctx.quadraticCurveTo(-17, 10, -10, 16); ctx.quadraticCurveTo(0, 22, 10, 16);
    ctx.quadraticCurveTo(17, 10, 16, -8); ctx.quadraticCurveTo(15, -22, 0, -22);
    ctx.quadraticCurveTo(-15, -22, -16, -8);
    ctx.fill();
    // short swept-back hair, slightly receding at the temples
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-16, -7);
    ctx.quadraticCurveTo(-18, -22, -6, -26); ctx.quadraticCurveTo(6, -29, 14, -22);
    ctx.quadraticCurveTo(18, -16, 16, -7);
    ctx.quadraticCurveTo(14, -14, 9, -15); ctx.quadraticCurveTo(4, -18, 0, -16);
    ctx.quadraticCurveTo(-6, -18, -10, -14); ctx.quadraticCurveTo(-14, -13, -16, -7);
    ctx.fill();
    // brows + happy closed eyes
    ctx.strokeStyle = HAIR; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, -9); ctx.lineTo(-3, -10); ctx.moveTo(3, -10); ctx.lineTo(11, -9); ctx.stroke();
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-6.5, -3, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(6.5, -3, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    // nose + cheeks
    ctx.strokeStyle = SKIN_D; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-1.5, 5); ctx.lineTo(1.5, 5.5); ctx.stroke();
    ctx.fillStyle = 'rgba(255,90,120,0.25)';
    ctx.beginPath(); ctx.arc(-10, 5, 3.5, 0, Math.PI * 2); ctx.arc(10, 5, 3.5, 0, Math.PI * 2); ctx.fill();
    // big open cheering grin
    ctx.fillStyle = '#5a0f1a';
    ctx.beginPath(); ctx.moveTo(-8, 8.5); ctx.quadraticCurveTo(0, 21, 8, 8.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-7, 9); ctx.lineTo(7, 9); ctx.lineTo(6, 11.5); ctx.lineTo(-6, 11.5); ctx.closePath(); ctx.fill();
    ctx.restore(); // unclip
  }

  // neon ring
  glow(col, 18);
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  noGlow();

  // speech bubble pops in after the badge
  const pk = clamp((cheerT - 0.15) * 5, 0, 1), popS = pk < 1 ? 0.6 + pk * 0.5 : 1 + Math.sin(tAll * 6) * 0.03;
  if (pk > 0 && cheerMsg) {
    const fs = PORTRAIT ? 14 : 16;
    ctx.font = `900 ${fs}px Orbitron, system-ui, sans-serif`;
    const tw = Math.min(ctx.measureText(cheerMsg).width, W - (cx + R + 40));
    const bx = cx + R + 14, byc = cy - R * 0.55, bw = tw + 22, bh = fs + 16;
    ctx.save();
    ctx.translate(bx, byc); ctx.scale(popS, popS);
    ctx.fillStyle = 'rgba(12,0,32,0.9)'; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0, -bh / 2, bw, bh, bh / 2); else ctx.rect(0, -bh / 2, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, bh / 2 - 6); ctx.lineTo(-10, bh / 2 + 6); ctx.lineTo(14, bh / 2 - 2); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(12,0,32,0.9)'; ctx.fillRect(3, bh / 2 - 7, 13, 5); // hide seam between tail and bubble
    ctx.restore();
    text(cheerMsg, bx + (bw / 2) * popS, byc, fs * popS, '#ffffff', 'center', 900, col);
  }
  ctx.restore();
}

function drawDead() {

  ctx.globalAlpha = a;

  text(String(score), W / 2, MID - 18, 64, '#ffffff', 'center', 900, '#ff4fd8');
  text(cells + ' ⚡ CELLS  ·  ' + Math.floor(dist / 10) + 'm', W / 2, MID + 30, 15, '#c9a6ff', 'center', 700, '#8a5bff');

  const rankLine = submitState === 'ok' ? 'GLOBAL RANK #' + lastRank
    : submitState === 'sending' ? 'SUBMITTING…'

  if (rankLine) text(rankLine, W / 2, MID + 100, 15, submitState === 'ok' ? '#2bff88' : '#ff9a3c', 'center', 700);
  if (deadT > 0.7) {
    ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(tAll * 4));
    text(TOUCH ? 'TAP TO RETRY' : 'TAP • SPACE TO RETRY', W / 2, PORTRAIT ? lerp(BOT, VH - OFFY - SAFE.b, 0.3) : BOT + 60,
      PORTRAIT ? 24 : 20, '#00e5ff', 'center', 700);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05000f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(S, 0, 0, S, sx * S, (OFFY + sy) * S);

  drawBackground();
  // speed lines
  if (speed > 560 && state === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
    const n = Math.floor((speed - 560) / 40);
    for (let i = 0; i < n; i++) {
      const y = TOP + 20 + ((i * 97.3 + Math.floor(tAll * 30) * 13) % (BOT - TOP - 40));
      const x = (W - ((tAll * speed * 2 + i * 233) % (W + 200)));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 80, y); ctx.stroke();
    }
  }
  drawRails();
  drawObjects();
  drawTrail();
  if (state !== 'dead') drawCar(CX, P.y, P.vis, P.run);
  drawSmoke();
  drawParticles();

  if (state === 'menu') drawMenu();
  drawHUD();
  if (state === 'dead') drawDead();

  // post: flash, scanlines, vignette
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.5; ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1;
  }
  ctx.drawImage(overlayCv, 0, 0);
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!(playersOpen && state === 'play')) update(dt); // paused while browsing all players
  draw();
  requestAnimationFrame(frame);
}

resize();
setMuted(muted);
renderPlayerChip();
if (new URLSearchParams(location.search).has('poster')) document.body.classList.add('poster'); // clean frame for the share image
reset();
requestAnimationFrame(frame);
})();
</script>
